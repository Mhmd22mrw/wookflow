name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # 1. إنشاء مشروع Flutter وهمي متكامل بالأساس لتوليد ملفات الأندرويد
      - name: Create Flutter Project Structure
        run: |
          flutter create . --org com.wookflow.app --project-name wookflow_app --platforms=android

      # 2. نقل ملف الكود الخاص بك إلى مكانه الصحيح في المشروع الجديد
      - name: Replace main.dart with custom code
        run: |
          # تأكد أن ملف main.dart الخاص بك موجود، سنقوم بنسخه أو تركه
          # المشروع المنشأ تلقائياً يحتوي على lib/main.dart بالفعل

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
