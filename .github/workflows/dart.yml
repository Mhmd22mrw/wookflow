name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. تثبيت لغة الجافا المطلوبة لتطبيق الأندرويد
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. تثبيت إطار العمل Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # 3. جلب المكتبات والتبعيات الخاصة بالتطبيق
      - name: Install dependencies
        run: flutter pub get

      # 4. بناء تطبيق الـ APK بنسخة الإنتاج
      - name: Build APK
        run: flutter build apk --release

      # 5. رفع ملف الـ APK الناتج لكي تستطيع تحميله من GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
