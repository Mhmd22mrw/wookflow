name: Build Modern Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          flutter create . --org com.wookflow.app --project-name wookflow_app --platforms=android

      - name: Update Android SDK Compile and Target Version
        run: |
          # تحديث ملفات Gradle لتدعم أحدث إصدارات أندرويد الحديثة
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 24/g' $GRADLE_FILE
            sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' $GRADLE_FILE
            sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' $GRADLE_FILE
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
