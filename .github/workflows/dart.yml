name: Build Flutter APK Automatically

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Create Clean Flutter Project & Copy Code
        run: |
          flutter create temp_app --org com.wookflow.app --project-name wookflow_app
          
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart temp_app/lib/main.dart
          fi
          
          cd temp_app
          # إضافة حزمة الحفظ المحلي تلقائياً قبل بناء التطبيق
          flutter pub add shared_preferences
          flutter pub get


      - name: 5. Build Release APK
        run: |
          cd temp_app
          flutter build apk --release

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
